                    }]
                },
                "25": {
                    title: "when I do and when I've done if and when",
                    description: "Use the present (not will) after when, if, as soon as, before, until.",
                    explanation: `<p>After <strong>when, if, as soon as, before, until</strong> we use the <strong>present</strong> (not will):</p>
                    <div class="example">I'll call you when I arrive. (not when I will arrive)</div>
                    <div class="example">We'll go out when it stops raining.</div>
                    <p>We use the <strong>present perfect</strong> to show one action is complete before another:</p>
                    <div class="example">When I've phoned Kate, we can go out.</div>
                    <p><strong>if</strong> = possible; <strong>when</strong> = certain:</p>
                    <div class="example">If I go out, I'll get some bread. (maybe)</div>
                    <div class="example">When I go out, I'll get some bread. (certain)</div>`,
                    exercises: [{
                        id: "25.1",
                        instruction: "Choose the correct form.",
                        items: [
                            { q: "Don't forget to lock the door when you ______ (go out / will go out).", a: "go out" },
                            { q: "As soon as we get any more information, we ______ (let / will let) you know.", a: "will let" },
                            { q: "I want to get to the cinema before the film ______ (starts / will start).", a: "starts" },
                            { q: "Don't drive through a red light. Wait until it ______ (changes / will change) to green.", a: "changes" },
                            { q: "Sarah will be here soon. I ______ (make / will make) some coffee when she comes.", a: "will make" },
                            { q: "I'm 20 now. I wonder where I'll be when I ______ (am / will be) 40.", a: "am" },
                            { q: "I ______ (wait / will wait) for you until you're ready, but don't be long.", a: "will wait" },
                            { q: "Oliver is five years old. He wants to be a TV presenter when he ______ (grows up / will grow up).", a: "grows up" },
                        ]
                    }, {
                        id: "25.2",
                        instruction: "Complete with will or the present.",
                        items: [
                            { q: "When you ______ (be) here again, you must come and see us.", a: "are" },
                            { q: "I want to see Sophie before she ______ (go) away next week.", a: "goes" },
                            { q: "Call me when you ______ (know) what time you're going to get here.", a: "know" },
                            { q: "There's no need to hurry. I ______ (wait) for you until you ______ (be) ready.", a: "will wait, are" },
                            { q: "I'm going out for about an hour. ______ you still ______ (be) here when I ______ (get) back?", a: "Will, be, get" },
                            { q: "I think everything will be fine, but if there ______ (be) any problems, I ______ (let) you know.", a: "are, will let" },
                            { q: "Kate looks completely different now. You ______ (not / recognise) her when you ______ (see) her again.", a: "won't recognise, see" },
                        ]
                    }]
                },
                "26": {
                    title: "can, could and (be) able to",
                    description: "Use can for ability and possibility. Use could for the past.",
                    explanation: `<p><strong>can</strong> + infinitive = ability or possibility:</p>
                    <div class="example">We can see the lake from our hotel.</div>
                    <p><strong>can't</strong> = cannot:</p>
                    <div class="example">I can't come to the party.</div>
                    <p><strong>be able to</strong> is used when can is not possible (e.g. future, perfect):</p>
                    <div class="example">I haven't been able to sleep recently.</div>
                    <p><strong>could</strong> = past of can:</p>
                    <div class="example">We could see the lake from our hotel.</div>
                    <p><strong>could</strong> and <strong>was able to</strong>: use could for general ability, was able to for a specific success:</p>
                    <div class="example">He could beat anybody. (general)</div>
                    <div class="example">He managed to beat him. (specific success)</div>`,
                    exercises: [{
                        id: "26.1",
                        instruction: "Complete with can or (be) able to.",
                        items: [
                            { q: "Gary has travelled a lot. He ______ speak five languages.", a: "can" },
                            { q: "I haven't ______ (sleep) very well recently.", a: "been able to" },
                            { q: "Nicole ______ drive, but she doesn't have a car.", a: "can" },
                            { q: "I used to stand on my head, but I can't do it any more. I used to ______ do it.", a: "be able to" },
                            { q: "I can't understand Mark. I've never ______ understand him.", a: "been able to" },
                            { q: "I can't see you on Friday, but I ______ meet you on Saturday morning.", a: "can" },
                            { q: "Ask Katherine about your problem. She might ______ help you.", a: "be able to" },
                            { q: "You have to be careful in this part of the city. It ______ be dangerous.", a: "can" },
                        ]
                    }, {
                        id: "26.2",
                        instruction: "Complete with could or was able to.",
                        items: [
                            { q: "My grandfather travelled a lot. He ______ speak five languages.", a: "could" },
                            { q: "I looked everywhere for the book, but I ______ find it.", a: "couldn't" },
                            { q: "They didn't want to come with us at first, but we ______ persuade them.", a: "managed to" },
                            { q: "Jessica had hurt her foot and ______ walk very well.", a: "couldn't" },
                            { q: "There was a small fire, but fortunately I ______ put it out.", a: "managed to" },
                            { q: "The walls were thin and I ______ hear people talking in the next room.", a: "could" },
                            { q: "I ran my first marathon recently. It was very hard, but I ______ finish.", a: "managed to" },
                            { q: "My grandmother loved music. She ______ play the piano very well.", a: "could" },
                            { q: "We wanted to go to the concert, but we ______ get tickets.", a: "couldn't" },
                        ]
                    }]
                },
                "27": {
                    title: "could (do) and could have (done)",
                    description: "Use could for possible actions now/future, and could have for past possibilities.",
                    explanation: `<p><strong>could</strong> = possible now or in the future (less sure than can):</p>
                    <div class="example">We could go to the cinema tonight.</div>
                    <p><strong>could have (done)</strong> = possible in the past but didn't happen:</p>
                    <div class="example">You could have stayed with me. (but you didn't)</div>
                    <div class="example">He could have hurt himself. (but he didn't)</div>
                    <p><strong>couldn't have</strong> = would not have been possible:</p>
                    <div class="example">It couldn't have been better.</div>`,
                    exercises: [{
                        id: "27.1",
                        instruction: "Choose could or could have.",
                        items: [
                            { q: "This is a wonderful place. I ______ stay here forever.", a: "could" },
                            { q: "I'm so angry with him. I ______ kill him!", a: "could" },
                            { q: "I hear a strange noise. What ______ it be?", a: "can" },
                            { q: "It's so nice here. I ______ sit here all day.", a: "could" },
                            { q: "I understand your point of view, but I don't agree with you. I ______ see it.", a: "can" },
                            { q: "Peter is a keen musician. He plays the flute and he ______ play the piano too.", a: "can" },
                            { q: "The company Amy works for isn't doing well. She ______ lose her job.", a: "could" },
                            { q: "Some people are unlucky. Life ______ be very unfair.", a: "can" },

                            { q: "Be careful climbing that tree. You ______ fall.", a: "could" },

                    }, {
                        id: "27.2",
                        instruction: "Complete with could have or could have + past participle.",
                        items: [
                            { q: "I'm tired. I feel as if I ______ (sleep) for a week.", a: "could sleep" },
                            { q: "I spent a boring evening at home. Why did you stay at home? You ______ (come) out with us.", a: "could have come" },
                            { q: "Shall I open this letter? Yes, it ______ (be) important.", a: "could be" },
                            { q: "How was your exam? It wasn't so bad. It ______ (be) worse.", a: "could have been" },
                            { q: "I got very wet in the rain. Why did you walk? You ______ (take) a taxi.", a: "could have taken" },
                            { q: "Where shall we meet tomorrow? I ______ (come) to your office if you like.", a: "could come" },
                            { q: "Does Tom still live in the same place? I'm not sure. He ______ (move).", a: "could have moved" },
                            { q: "Did you go to university? No. I ______ (go), but I didn't want to.", a: "could have gone" },
                        ]
                    }]
                },
                "28": {
                    title: "must and can't",
                    description: "Use must for certainty, can't for impossibility.",
                    explanation: `<p><strong>must</strong> = I am sure something is true:</p>
                    <div class="example">You've been travelling all day. You must be tired.</div>
                    <p><strong>can't</strong> = I am sure something is not possible:</p>
                    <div class="example">You've just had lunch. You can't be hungry already.</div>
                    <p>For the past: <strong>must have</strong> and <strong>can't have</strong>:</p>
                    <div class="example">I lost my glove. I must have dropped it somewhere.</div>
                    <div class="example">She can't have got my message.</div>`,
                    exercises: [{
                        id: "28.1",
                        instruction: "Put in must or can't.",
                        items: [

                "29": {
                    title: "may and might 1",
                    description: "Use may/might for possibility in the present and past.",
                    explanation: `<p><strong>may</strong> and <strong>might</strong> = perhaps (something is possible):</p>
                    <div class="example">It may be true. / It might be true. (perhaps it is true)</div>
                    <p>Negative: <strong>may not</strong>, <strong>might not</strong>:</p>
                    <div class="example">She might not know. (perhaps she doesn't know)</div>
                    <p>For the past: <strong>may have</strong>, <strong>might have</strong>:</p>
                    <div class="example">She may have been asleep. (perhaps she was asleep)</div>
                    <p><strong>could</strong> is similar to may/might, but <strong>couldn't</strong> is different from may not/might not:</p>
                    <div class="example">She couldn't have received my message. (it's not possible)</div>`,

                "30": {
                    title: "may and might 2",
                    description: "Use may/might for possible future actions and with as well.",
                    explanation: `<p><strong>may/might</strong> for possible future actions:</p>
                    <div class="example">I may go to Ireland. (perhaps I will go)</div>
                    <div class="example">It might rain later.</div>
                    <p>Use <strong>might</strong> (not may) when the situation is not real:</p>
                    <div class="example">If they paid me better, I might work harder.</div>

                "31": {
                    title: "have to and must",
                    description: "Have to and must are used for obligation. Mustn't and don't have to are different.",
                    explanation: `<p><strong>have to</strong> = it is necessary (often from an external rule):</p>
                    <div class="example">I have to wear glasses for reading.</div>
                    <p><strong>must</strong> = I think it is necessary (personal opinion):</p>
                    <div class="example">I must phone Sue. (I say this)</div>
                    <p>For the past, use <strong>had to</strong>:</p>
                    <div class="example">I had to leave early.</div>
                    <p><strong>mustn't</strong> = don't do it:</p>
                    <div class="example">You mustn't tell anyone.</div>
                    <p><strong>don't have to</strong> = it's not necessary:</p>
                    <div class="example">You don't have to come with me.</div>`,

                "32": {
                    title: "must mustn't needn't",
                    description: "Mustn't = it is necessary not to do. Needn't = it is not necessary.",
                    explanation: `<p><strong>mustn't</strong> = don't do it:</p>
                    <div class="example">You mustn't tell anyone. (it's forbidden)</div>

                    <div class="example">We needn't hurry. (we don't need to)</div>

                "34": {

                    description: "Use should after insist, demand, recommend, suggest, and after some adjectives.",

                "37": {
                    title: "can/could/would you … ? etc.",
                    description: "Use can/could for requests, may for permission, would like for offers.",
                    explanation: `<p><strong>Can/Could you … ?</strong> = asking people to do things:</p>
                    <div class="example">Could you open the door, please?</div>
                    <p><strong>Can/Could I have … ?</strong> = asking for things:</p>
                    <div class="example">Can I have these postcards, please?</div>
                    <p><strong>Can/Could I … ?</strong> = asking to do things:</p>
                    <div class="example">Could I use your phone charger?</div>
                    <p><strong>Would you like … ?</strong> = offering and inviting:</p>
                    <div class="example">Would you like some coffee?</div>
                    <p><strong>I'd like</strong> = a polite way to say what you want:</p>
                    <div class="example">I'd like to try on this jacket.</div>`,

                "38": {
                    title: "if I do … and if I did …",
                    description: "Use if + present for real possibility, if + past for unreal/unlikely situations.",
                    explanation: `<p><strong>if + present</strong> = real possibility:</p>
                    <div class="example">If we take the bus, it will be cheaper.</div>
                    <p><strong>if + past</strong> = unreal / unlikely situation:</p>
                    <div class="example">If we took the bus, it would be cheaper, but we're taking the train.</div>
                    <p>We don't use <strong>would</strong> in the if-part:</p>
                    <div class="example">If I won a lot of money, I'd buy a house. (not if I would win)</div>
                    <p><strong>would</strong> is in the other part:</p>
                    <div class="example">I'd be scared if somebody pointed a gun at me.</div>`,
                    exercises: [{

                        instruction: "Complete the sentences.",

                "39": {
                    title: "if I knew … I wish I knew …",
                    description: "Use if + past for unreal present situations. Use wish + past for regrets about the present.",
                    explanation: `<p><strong>if + past</strong> for unreal present situations:</p>
                    <div class="example">If I knew his number, I would phone him. (but I don't know)</div>
                    <p><strong>I wish + past</strong> = I regret something now:</p>
                    <div class="example">I wish I knew his number. (I don't know and I regret it)</div>
                    <p><strong>were</strong> is often used instead of <strong>was</strong>:</p>
                    <div class="example">If I were you, I wouldn't buy that coat.</div>
                    <p>We don't use <strong>would</strong> in the if-part:</p>
                    <div class="example">If I were rich, I would travel a lot. (not if I would be rich)</div>`,

                "40": {
                    title: "if I had known … I wish I had known …",
                    description: "Use if + had (done) for unreal past situations. Use wish + had (done) for past regrets.",
                    explanation: `<p><strong>if + had (done)</strong> for unreal past:</p>
                    <div class="example">If I'd known you were in hospital, I would have visited you. (but I didn't know)</div>
                    <p><strong>I wish + had (done)</strong> = I regret the past:</p>
                    <div class="example">I wish I'd known about the party. (I didn't know, and I regret it)</div>

                    <div class="example">If I had seen you, I would have said hello. (not if I would have seen)</div>`,

                "41": {
                    title: "wish",
                    description: "Use wish for regrets. Use hope for future wishes.",
                    explanation: `<p><strong>wish</strong> = regret about the present or past:</p>
                    <div class="example">I wish I knew the answer. (present regret)</div>

                "42": {
                    title: "Passive 1 (is done / was done)",
                    description: "Form: be + past participle. Use when the focus is on the action, not the doer.",
                    explanation: `<p><strong>Passive</strong> = be + past participle:</p>
                    <div class="example">This house was built in 1981.</div>
                    <p>Use the passive when we don't know or it's not important who did the action:</p>
                    <div class="example">A lot of money was stolen.</div>
                    <p>If we want to say who did it, we use <strong>by</strong>:</p>
                    <div class="example">This house was built by my grandfather.</div>
                    <p>Compare active and passive:</p>
                    <div class="example">Somebody cleans this room every day. (active)</div>
                    <div class="example">This room is cleaned every day. (passive)</div>`,
                    exercises: [{
                        id: "42.1",
                        instruction: "Complete with the passive.",

                            { q: "We were driving fast, but we ______ (overtake) by a lot of other cars.", a: "were overtaken" },
                            { q: "Elections for president ______ (hold) every four years.", a: "are held" },
                            { q: "There was an accident, but nobody ______ (injure).", a: "was injured" },
                            { q: "You can't see the house. It ______ (surround) by trees.", a: "is surrounded" },
                            { q: "I never received the letter. It ______ (send) to the wrong address.", a: "was sent" },
                            { q: "The company I work for ______ (own) by a much larger company.", a: "is owned" },

                        instruction: "Write questions in the passive.",
                        items: [

                "43": {
                    title: "Passive 2 (be done / been done / being done)",
                    description: "Passive forms for different tenses and modal verbs.",
                    explanation: `<p><strong>Infinitive passive</strong>: to be done</p>
                    <div class="example">A mystery is something that can't be explained.</div>
                    <p><strong>Perfect infinitive passive</strong>: to have been done</p>
                    <div class="example">The letter might have been sent to the wrong address.</div>
                    <p><strong>Present perfect passive</strong>: has/have been done</p>
                    <div class="example">The trip has been cancelled.</div>
                    <p><strong>Present continuous passive</strong>: is/are being done</p>
                    <div class="example">The room is being cleaned.</div>`,

                "44": {
                    title: "Passive 3",
                    description: "Passive with verbs that take two objects, and get in the passive.",
                    explanation: `<p>Some verbs have <strong>two objects</strong>:</p>

                "45": {
                    title: "it is said that … he is said to … he is supposed to …",
                    description: "Use it is said that ... and He is said to ... for reported statements.",
                    explanation: `<p><strong>It is said that ...</strong> = people say that ...:</p>
                    <div class="example">It is said that he is 108 years old.</div>
                    <p><strong>He is said to ...</strong>:</p>
                    <div class="example">He is said to be 108 years old.</div>
                    <p>Other verbs: <strong>alleged, believed, considered, expected, known, reported, thought, understood</strong>.</p>
                    <p><strong>supposed to</strong> = intended, expected:</p>
                    <div class="example">The plan is supposed to be a secret.</div>
                    <p><strong>not supposed to</strong> = not allowed:</p>
                    <div class="example">You're not supposed to park here.</div>`,

                            { q: "It is reported that the building has been damaged. The building is reported ______ damaged.", a: "to have been" },

                "46": {
                    title: "have something done",
                    description: "Use have + object + past participle to say that someone else does something for you.",
                    explanation: `<p><strong>have something done</strong> = arrange for someone else to do it for you:</p>
                    <div class="example">I had the roof repaired. (someone else repaired it)</div>
                    <p><strong>get something done</strong> is also possible (more informal).</p>
                    <p>Also used for <strong>something bad that happens</strong>:</p>
                    <div class="example">We had our bags stolen. (they were stolen)</div>`,

                "47": {
                    title: "Reported speech 1 (he said that …)",
                    description: "Use reported speech to say what someone said.",
                    explanation: `<p>In reported speech, verbs <strong>go back one tense</strong>:</p>
                    <div class="example">"I'm feeling ill." → He said he was feeling ill.</div>
                    <p><strong>Present → Past</strong></p>
                    <div class="example">am/is → was, have/has → had, will → would, can → could</div>
                    <p>The past simple can stay the same or change to past perfect:</p>
                    <div class="example">He said he woke up / had woken up.</div>`,
                    exercises: [{
                        id: "47.1",
                        instruction: "Write the reported speech.",
                        items: [
                            { q: "Paul said: 'I'm feeling ill.' → Paul said he ______ feeling ill.", a: "was" },
                            { q: "Tom said: 'It's too far. Let's get a taxi.' → Tom said it ______ too far.", a: "was" },
                            { q: "Anna said: 'I don't want to go.' → Anna said she ______ want to go.", a: "didn't" },
                            { q: "Dan said: 'I'll let you know next week.' → Dan said he ______ let me know next week.", a: "would" },
                            { q: "Ben said: 'I haven't seen her for a while.' → Ben said he ______ seen her for a while.", a: "hadn't" },
                            { q: "Kate said: 'You can borrow mine.' → Kate said I ______ borrow hers.", a: "could" },
                            { q: "Sue said: 'I'm not enjoying it.' → Sue said she ______ enjoying it.", a: "wasn't" },
                            { q: "James said: 'I sold it a few months ago.' → James said he ______ sold it a few months ago.", a: "had" },
                            { q: "Sarah said: 'I don't know.' → Sarah said she ______ know.", a: "didn't" },
                            { q: "Amy said: 'There are twenty students.' → Amy said there ______ twenty students.", a: "were" },
                        ]
                    }, {
                        id: "47.2",
                        instruction: "Complete with the correct form.",
                        items: [
                            { q: "The man at reception said it was only five minutes' walk. Is it? He said it ______ only five minutes' walk.", a: "was" },
                            { q: "I saw Sue a few days ago and she said she couldn't come. Is she coming? She said she ______ come.", a: "couldn't" },
                            { q: "Last week you said you didn't like each other. Does she get on with Paul? You said you ______ like each other.", a: "didn't" },
                            { q: "He told me he didn't know anyone. Does Joe know lots of people? He said he ______ know anyone.", a: "didn't" },
                            { q: "She said she was going away. Is Jane coming? She said she ______ going away.", a: "was" },
                            { q: "I thought you said you were staying at home. Are you going out? I thought you said you ______ staying at home.", a: "were" },
                            { q: "Earlier you said you couldn't speak any other languages. Do you speak French? You said you ______ speak any other languages.", a: "couldn't" },
                            { q: "He told me he saw you last weekend. I haven't seen Ben. He said he ______ you last weekend.", a: "saw" },
                        ]
                    }]
                },
                "48": {
                    title: "Reported speech 2",
                    description: "Sometimes we don't change the tense if the situation is still true.",
                    explanation: `<p>We <strong>don't always change</strong> the verb if the situation is still the same:</p>
                    <div class="example">Paul said his new job is boring. (it's still boring)</div>
                    <p>We <strong>must</strong> change it if the situation has changed:</p>
                    <div class="example">Rachel said you were in hospital. (but you're not)</div>
                    <p><strong>say and tell</strong>:</p>
                    <div class="example">He told me that ... / He said (that) ...</div>
                    <p><strong>tell somebody to do something</strong>:</p>
                    <div class="example">The doctor told me to drink plenty of water.</div>`,
                    exercises: [{
                        id: "48.1",
                        instruction: "Complete the sentences with say or tell.",
                        items: [
                            { q: "Anna ______ goodbye to me and left.", a: "said" },
                            { q: "______ us about your holiday. Did you have a nice time?", a: "Tell" },

                            { q: "I wonder where Sue is. She ______ she would be here at 8.", a: "said" },
                            { q: "Dan ______ me that he was bored with his job.", a: "told" },
                            { q: "The doctor ______ that I should rest.", a: "said" },
                            { q: "Gary couldn't help me. He ______ me to ask Chris.", a: "told" },
                            { q: "Gary couldn't help me. He ______ to ask Chris.", a: "said" },
                            { q: "Don't ______ anybody what I ______. It's a secret.", a: "tell, said" },
                            { q: "Did Kate ______ you what happened? No, she didn't ______ anything to me.", a: "tell, say" },
                        ]
                    }, {
                        id: "48.2",
                        instruction: "Write the reported speech.",
                        items: [
                            { q: "'Hurry up!' → He told me to ______ up.", a: "hurry" },
                            { q: "'Please slow down!' → She asked me to ______ down.", a: "slow" },
                            { q: "'Don't worry, Sue.' → I told Sue not to ______.", a: "worry" },
                            { q: "'Can you help me, Tom?' → I asked Tom to ______ me.", a: "help" },
                            { q: "'Mind your own business.' → I told him to ______ his own business.", a: "mind" },
                            { q: "'Can you open your bag?' → The security guard asked me to ______ my bag.", a: "open" },
                            { q: "'Will you marry me?' → He asked her to ______ him.", a: "marry" },
                            { q: "'Don't wait for me if I'm late.' → She told me not to ______ for her if she was late.", a: "wait" },
                        ]
                    }]
                },
                "49": {
                    title: "Questions 1",
                    description: "In questions, the subject goes after the first verb.",
                    explanation: `<p>In questions, the subject is <strong>after</strong> the first verb:</p>
                    <div class="example">Is Katherine working today? (not Is working Katherine)</div>
                    <p>Present simple: use <strong>do/does</strong>:</p>
                    <div class="example">Do you live near here?</div>
                    <p>Past simple: use <strong>did</strong>:</p>
                    <div class="example">Did you sell your car?</div>
                    <p>If the question word is the <strong>subject</strong>, don't use do/does/did:</p>
                    <div class="example">Who phoned Emma? (not Who did phone)</div>`,
                    exercises: [{
                        id: "49.1",
                        instruction: "Write the questions.",
                        items: [
                            { q: "Ask about Joe: (where / live?) Where ______", a: "do you live" },
                            { q: "Ask about Joe: (born there?) ______ you born there?", a: "Were" },
                            { q: "Ask about Joe: (married?) ______ you married?", a: "Are" },
                            { q: "Ask about Joe: (how long?) How long ______ you been married?", a: "have" },
                            { q: "Ask about Joe: (what / do?) What ______ you do?", a: "do" },
                            { q: "Ask about Joe: (wife / do?) What ______ your wife do?", a: "does" },
                            { q: "Ask about Joe: (children?) ______ you have children?", a: "Do" },
                            { q: "Ask about Joe: (how old?) How old ______ they?", a: "are" },
                        ]
                    }, {
                        id: "49.2",
                        instruction: "Write questions with who or what.",
                        items: [
                            { q: "Somebody hit me. Who ______ you?", a: "hit" },
                            { q: "I hit somebody. Who ______ you hit?", a: "did" },
                            { q: "Somebody paid the bill. Who ______ the bill?", a: "paid" },
                            { q: "I'm worried about something. What ______ you worried about?", a: "are" },
                            { q: "Something happened. What ______?", a: "happened" },
                            { q: "Diane said something. What ______ Diane say?", a: "did" },
                            { q: "This book belongs to somebody. Who ______ it belong to?", a: "does" },
                            { q: "Somebody lives in that house. Who ______ in that house?", a: "lives" },
                            { q: "I fell over something. What ______ you fall over?", a: "did" },
                            { q: "Something fell off the shelf. What ______ off the shelf?", a: "fell" },
                            { q: "This word means something. What ______ this word mean?", a: "does" },
                            { q: "Sarah was with somebody. Who ______ Sarah with?", a: "was" },
                            { q: "I'm looking for something. What ______ you looking for?", a: "are" },
                            { q: "Emma reminds me of somebody. Who ______ she remind you of?", a: "does" },
                        ]
                    }]
                },
                "50": {
                    title: "Questions 2 (do you know where … ? / he asked me where …)",
                    description: "In embedded questions, the word order is subject + verb.",
                    explanation: `<p>In longer questions like <strong>Do you know … ?</strong>, the word order changes:</p>
                    <div class="example">Where has Tom gone? → Do you know where Tom has gone?</div>
                    <p>Use <strong>if</strong> or <strong>whether</strong> when there is no question word:</p>
                    <div class="example">I don't know if anybody saw me.</div>
                    <p>In <strong>reported questions</strong>, the same word order is used:</p>
                    <div class="example">He asked me where I was going.</div>`,
                    exercises: [{
                        id: "50.1",
                        instruction: "Choose the correct form.",
                        items: [
                            { q: "Do you know what time the film ______? (a) starts (b) does start (c) start", a: "a" },
                            { q: "Why ______ get up so early? (a) does Amy (b) Amy does (c) Amy", a: "a" },
                            { q: "I want to know what this word ______. (a) means (b) does mean (c) mean", a: "a" },
                            { q: "I can't remember where I ______ the car. (a) parked (b) did park (c) park", a: "a" },
                            { q: "Why ______ phone me yesterday? (a) didn't you (b) you didn't (c) you not", a: "a" },
                            { q: "Do you know where Helen ______? (a) works (b) does work (c) work", a: "a" },
                            { q: "How much ______ to park here? (a) does it cost (b) it costs (c) cost", a: "a" },
                            { q: "Tell me what you ______. (a) want (b) do want (c) wants", a: "a" },
                        ]
                    }, {
                        id: "50.2",
                        instruction: "Put the words in the correct order.",
                        items: [
                            { q: "(it / you / what time / know / is) Do you know what time ______?", a: "it is" },
                            { q: "(is / to the airport / far / it) How ______ to the airport?", a: "far is it" },
                            { q: "(wonder / is / how / old / Tom) I wonder how old ______.", a: "Tom is" },
                            { q: "(they / married / been / have) How long ______ married?", a: "have they been" },
                            { q: "(they / married / how long / been / have / know) Do you know how long ______ married?", a: "they have been" },
                            { q: "(tell / the station / you / me / is / where) Could you tell me where ______?", a: "the station is" },
                            { q: "(in the accident / injured / anyone / don't / know / whether / was) I don't know whether ______.", a: "anyone was injured in the accident" },
                            { q: "(what / tomorrow / know / time / will / arrive / you / you) Do you know what time ______ tomorrow?", a: "you will arrive" },
                        ]
                    }]
                },
                "51": {
                    title: "Auxiliary verbs (have/do/can etc.) I think so / I hope so etc.",
                    description: "Use auxiliary verbs to avoid repetition, in short answers, and with so/neither.",
                    explanation: `<p>Use an <strong>auxiliary verb</strong> to avoid repeating something:</p>
                    <div class="example">'Have you locked the door?' 'Yes, I have.'</div>
                    <p>Use <strong>So am I / Neither do I</strong> to say you feel the same:</p>
                    <div class="example">'I'm tired.' 'So am I.' (I'm tired too)</div>
                    <div class="example">'I don't like it.' 'Neither do I.'</div>
                    <p><strong>I think so / I hope so</strong> etc.:</p>
                    <div class="example">'Is it going to rain?' 'I hope not.'</div>`,
                    exercises: [{
                        id: "51.1",
                        instruction: "Complete with the auxiliary verb.",
                        items: [
                            { q: "I wasn't tired, but my friends ______.", a: "were" },

                        instruction: "Answer with So … or Neither …",

                            { q: "I didn't enjoy the film. → Neither ______ I.", a: "did" },
                            { q: "I'm not tired. → Neither ______ I.", a: "am" },
                            { q: "I thought the exam was easy. → ______ did I.", a: "So" },
                        ]
                    }, {
                        id: "51.3",
                        instruction: "Complete with I think so, I hope not, etc.",
                        items: [

                            { q: "Do you think you'll get a pay rise? I ______ so. (hope)", a: "hope" },

                            { q: "Is Amy married? I ______ so. (think)", a: "think" },
                            { q: "Does Jane speak Italian? I ______ so. (suppose)", a: "suppose" },

                },
                "52": {
                    title: "Question tags (do you? isn't it? etc.)",
                    description: "Use question tags to confirm information or ask for agreement.",
                    explanation: `<p><strong>Question tags</strong> are mini-questions at the end of sentences:</p>
                    <div class="example">You haven't seen Lisa today, have you?</div>
                    <p>Positive sentence → negative tag:</p>
                    <div class="example">Kate will be here soon, won't she?</div>
                    <p>Negative sentence → positive tag:</p>
                    <div class="example">Kate won't be late, will she?</div>
                    <p>Use <strong>Let's … , shall we?</strong></p>
                    <p>Use <strong>aren't I?</strong> for I'm …</p>`,

                            { q: "They won't mind, ______ they?", a: "will" },

                            { q: "This isn't very interesting, ______ it?", a: "is" },
                            { q: "I'm too impatient, ______ I?", a: "aren't" },
                            { q: "You wouldn't tell anyone, ______ you?", a: "would" },
                            { q: "Helen has lived here a long time, ______ she?", a: "hasn't" },
                            { q: "I shouldn't have lost my temper, ______ I?", a: "should" },
                            { q: "He'd never met her before, ______ he?", a: "had" },
                            { q: "Don't forget to call me, ______ you?", a: "will" },

                    }, {
                        id: "52.2",
                        instruction: "Write a question tag for the situation.",
                        items: [
                            { q: "It's a beautiful day, ______?", a: "isn't it" },
                            { q: "It's very expensive, ______?", a: "isn't it" },
                            { q: "The course was great, ______?", a: "wasn't it" },
                            { q: "You've had your hair cut, ______ you?", a: "haven't" },
                            { q: "She has a good voice, ______ she?", a: "doesn't" },
                            { q: "It doesn't look right, ______ it?", a: "does" },
                            { q: "This bridge isn't very safe, ______ it?", a: "is" },

                },
                "53": {
                    title: "Verb + -ing (enjoy doing / stop doing etc.)",
                    description: "Some verbs are followed by -ing.",
                    explanation: `<p>After <strong>enjoy, mind, suggest</strong> and many other verbs, use <strong>-ing</strong>:</p>
                    <div class="example">I enjoy reading.</div>
                    <div class="example">Would you mind closing the door?</div>
                    <p>Other verbs: <strong>stop, finish, recommend, consider, admit, deny, avoid, risk, imagine, fancy</strong>.</p>
                    <p><strong>give up, put off, go on, carry on, keep (on)</strong> + -ing.</p>
                    <p><strong>having done</strong> is also possible for finished actions.</p>`,
                    exercises: [{
                        id: "53.1",
                        instruction: "Complete with the -ing form.",
                        items: [
                            { q: "She suggested ______ to the zoo. (go)", a: "going" },

                        ]
                    }, {
                        id: "53.2",
                        instruction: "Complete with -ing.",
                        items: [
                            { q: "He tried to avoid ______ my question. (answer)", a: "answering" },
                            { q: "Please stop ______ so much noise! (make)", a: "making" },
                            { q: "I enjoy ______ to music. (listen)", a: "listening" },
                            { q: "I considered ______ for the job. (apply)", a: "applying" },
                            { q: "Have you finished ______ the newspaper? (read)", a: "reading" },
                            { q: "We can't go on ______ like this. (live)", a: "living" },
                            { q: "It's better to avoid ______ during rush hour. (travel)", a: "travelling" },
                            { q: "I keep ______ things. (forget)", a: "forgetting" },
                            { q: "I've put off ______ this bill. (pay)", a: "paying" },
                            { q: "I've given up ______ to learn Japanese. (try)", a: "trying" },
                            { q: "If you gamble, you risk ______ your money. (lose)", a: "losing" },
                            { q: "Would you mind not ______ me all the time? (interrupt)", a: "interrupting" },
                        ]
                    }]
                },
                "54": {
                    title: "Verb + to … (decide to … / forget to … etc.)",
                    description: "Some verbs are followed by to + infinitive.",
                    explanation: `<p>After <strong>decide, agree, forget, hope, learn, manage, offer, plan, promise, refuse, threaten, want</strong> etc. use <strong>to + infinitive</strong>:</p>

                "55": {
                    title: "Verb (+ object) + to … (I want you to …)",
                    description: "Some verbs take object + to + infinitive.",
                    explanation: `<p><strong>want, expect, ask, help, would like, would prefer</strong> + object + to …:</p>

                    <p><strong>tell, advise, remind, warn, invite, encourage, persuade, get, force, teach, allow, enable</strong> + object + to …</p>

                    <div class="example">She made me promise. (not made me to promise)</div>

                "56": {
                    title: "Verb + -ing or to … 1 (remember, regret etc.)",
                    description: "Some verbs change meaning with -ing or to.",
                    explanation: `<p><strong>remember + -ing</strong> = remember something you did:</p>
                    <div class="example">I remember locking the door. (I did it and I remember)</div>
                    <p><strong>remember + to …</strong> = remember to do something:</p>
                    <div class="example">I remembered to lock the door. (I didn't forget)</div>
                    <p><strong>regret + -ing</strong> = sorry about something you did:</p>
                    <div class="example">I regret saying that.</div>
                    <p><strong>regret + to …</strong> = I'm sorry to say:</p>
                    <div class="example">I regret to say that we are unable to accept your offer.</div>
                    <p><strong>go on + -ing</strong> = continue:</p>
                    <div class="example">He went on talking.</div>

                "57": {
                    title: "Verb + -ing or to … 2 (try, need, help)",
                    description: "Try, need, and help have different meanings with -ing and to.",
                    explanation: `<p><strong>try + to …</strong> = attempt, make an effort:</p>
                    <div class="example">I tried to keep my eyes open.</div>
                    <p><strong>try + -ing</strong> = do something as an experiment:</p>
                    <div class="example">Try pressing the green button.</div>
                    <p><strong>need + to …</strong> = it is necessary for me to do it:</p>
                    <div class="example">I need to charge my phone.</div>

                    <div class="example">Can you help me (to) move this table?</div>

                "58": {
                    title: "Verb + -ing or to … 3 (like / would like etc.)",
                    description: "Like, love, hate can take -ing or to. Would like takes to.",
                    explanation: `<p><strong>like, love, hate</strong> can be followed by -ing or to ….</p>

                "59": {

                "60": {
                    title: "Preposition (in/for/about etc.) + -ing",
                    description: "After a preposition, use -ing.",
                    explanation: `<p>After a <strong>preposition</strong> (in, for, about, etc.), use <strong>-ing</strong>:</p>

                "64": {

                "65": {

                    description: "Use adjective + to + infinitive.",
                    explanation: `<p><strong>hard/difficult/easy/interesting etc. + to …</strong>:</p>

                "66": {
                    title: "to … (afraid to do) and preposition + -ing (afraid of doing)",
                    description: "The meaning changes with afraid, interested, sorry depending on to or -ing.",
                    explanation: `<p><strong>afraid to do</strong> = don't want to do it because it's dangerous or the result could be bad:</p>
                    <div class="example">People are afraid to walk here at night.</div>
                    <p><strong>afraid of doing</strong> = afraid that something bad will happen:</p>
                    <div class="example">We were afraid of falling.</div>
                    <p><strong>interested in doing</strong> = thinking of doing it:</p>
                    <div class="example">I'm interested in joining the club.</div>

                    <div class="example">Sorry for shouting at you.</div>

                    <p><strong>clean up</strong>, <strong>clear up</strong>, <strong>tidy up</strong>, <strong>wash up</strong>.</p>
                    <p><strong>end up</strong>, <strong>give up</strong>, <strong>make up</strong>, <strong>take up</strong>, <strong>turn up</strong>, <strong>use up</strong>.</p>`,
                    exercises: [{
                        id: "143.1",
                        instruction: "Complete with up.",
                        items: [

                    explanation: `<p><strong>bring up</strong> = introduce a topic.</p>

                    <p><strong>break up</strong>, <strong>do up</strong>, <strong>look up</strong>, <strong>put up with</strong>, <strong>hold up</strong>, <strong>mix up</strong>.</p>`,
                    exercises: [{
                        id: "144.1",
                        instruction: "Complete with up.",
                        items: [
                            { q: "He tore up the letter. (up)", a: "up" },
                            { q: "Jane came up with a good suggestion. (up with)", a: "up with" },
                            { q: "Paul is always making up excuses. (up)", a: "up" },
                            { q: "You should do up your jacket. (up)", a: "up" },
                            { q: "I don't think you should bring up that subject. (up)", a: "up" },
                            { q: "I'm saving up for a motorbike. (up)", a: "up" },
                            { q: "We had to put up with a lot of bad weather. (up with)", a: "up with" },
                        ]
                    }, {
                        id: "144.2",
                        instruction: "Complete with a phrasal verb with up.",
                        items: [
                            { q: "It's cleared up now. (cleared up)", a: "cleared up" },
                            { q: "She was held up in the traffic. (held up)", a: "held up" },
                            { q: "They did it up. (did it up)", a: "did it up" },
                            { q: "We took him out to cheer him up. (cheer him up)", a: "cheer him up" },
                        ]
                    }]
                },
                "145": {
                    title: "Phrasal verbs 9 away/back",
                    description: "Use away for moving from, back for returning.",
                    explanation: `<p><strong>go away</strong>, <strong>drive away</strong>, <strong>walk away</strong>, <strong>run away</strong>, <strong>fly away</strong>.</p>
                    <p><strong>come back</strong>, <strong>get back</strong>, <strong>go back</strong>, <strong>take back</strong>.</p>
                    <p><strong>get away (with)</strong>, <strong>keep away</strong>, <strong>give away</strong>, <strong>put away</strong>, <strong>throw away</strong>.</p>
                    <p><strong>call back</strong>, <strong>pay back</strong>.</p>`,
                    exercises: [{
                        id: "145.1",
                        instruction: "Complete with away or back.",
                        items: [
                            { q: "He waved ______. (back)", a: "back" },
                            { q: "It blew ______. (away)", a: "away" },
                            { q: "She put it ______ in the envelope. (back)", a: "back" },
                            { q: "He threw them ______. (away)", a: "away" },
                            { q: "She just walked ______. (away)", a: "away" },
                            { q: "He threw it ______ to her. (back)", a: "back" },
                        ]
                    }, {
                        id: "145.2",
                        instruction: "Complete with a phrasal verb with away or back.",
                        items: [
                            { q: "I got ______ very late. (back)", a: "back" },
                            { q: "I think they must have gone ______. (away)", a: "away" },
                            { q: "What time will you be ______? (back)", a: "back" },
                            { q: "He ran ______. (away)", a: "away" },
                            { q: "You might get ______ with it. (away)", a: "away" },
                            { q: "Keep ______ from it. (away)", a: "away" },
                            { q: "He didn't smile ______. (back)", a: "back" },
                        ]
                    }]
                }
            },
            studyGuide: {
                items: [
                    { q: "At first I didn't like my job, but I ______ to enjoy it now.", a: "A", options: "A I'm starting B I start C I'd start", units: "1" },
                    { q: "I don't understand this sentence. What ______?", a: "B", options: "A does mean this word B does this word mean C means this word", units: "2" },
                    { q: "Robert ______ away two or three times a year.", a: "C", options: "A is going usually B is usually going C usually goes D goes usually", units: "2,3,110" },
                    { q: "How ______ now? Better than before?", a: "B,C", options: "A you are feeling B do you feel C are you feeling", units: "4" },
                    { q: "It was a boring weekend. I ______ anything.", a: "C", options: "A didn't B I don't do C I didn't do", units: "5" },
                    { q: "Matt ______ while we were having dinner.", a: "A", options: "A phoned B was phoning C has phoned", units: "6,14" },
                    { q: "James is on holiday. He ______ to Italy.", a: "B", options: "A is gone B has gone C has been", units: "7" },
                    { q: "Everything is going well. There ______ any problems so far.", a: "C", options: "A weren't B have been C haven't been", units: "8" },
                    { q: "Sarah has lost her passport again. This is the second time this ______.", a: "A", options: "A has happened B happens C happened D is happening", units: "8" },
                    { q: "Why are you out of breath? ______?", a: "C", options: "A Are you running B Have you run C Have you been running", units: "9" },
                    { q: "Where's the book I gave you? What ______ with it?", a: "A", options: "A have you done B have you been doing C are you doing", units: "10" },
                    { q: "How long ______ Jane?", a: "B", options: "A do you know B have you known C have you been knowing", units: "11,10" },
                    { q: "Sally has been working here ______.", a: "A,D", options: "A for six months B since six months C six months ago D six months", units: "12" },
                    { q: "It's two years ______ Joe.", a: "D", options: "A that I don't see B that I haven't seen C since I didn't see D since I last saw", units: "12" },
                    { q: "It ______ raining for a while, but now it's raining again.", a: "A", options: "A stopped B has stopped C was stopped", units: "13" },
                    { q: "My mother ______ in Italy.", a: "A", options: "A grew up B has grown up C had grown up", units: "13" },
                    { q: "______ a lot of sweets when you were a child?", a: "C", options: "A Have you eaten B Had you eaten C Did you eat", units: "14" },
                    { q: "Jack ______ in New York for ten years. Now he lives in Los Angeles.", a: "A", options: "A lived B has lived C has been living", units: "14,11" },
                    { q: "The people sitting next to me were nervous. They ______ before.", a: "C,D", options: "A haven't flown B didn't fly C hadn't flown D'd never flown", units: "15" },
                    { q: "Katherine was lying on the sofa. She was tired because ______.", a: "C", options: "A she was working B she's been working C she'd been working", units: "16" },
                    { q: "______ a car when you were living in Paris?", a: "D", options: "A Had you B Were you having C Have you had D Did you have", units: "17,14" },
                    { q: "I ______ tennis a lot, but I don't play very much now.", a: "C", options: "A was playing B was used to play C used to play", units: "18" },
                ]
            }
        };
        // ─── APP STATE ────────────────────────────────────────────────────────
        let currentUnit = "1";
        let completedExercises = new Set();
        let exerciseInputs = {};
        let exerciseFeedback = {};

        // ─── DOM REFS ────────────────────────────────────────────────────────
        const app = document.getElementById('app');

        // ─── RENDER ──────────────────────────────────────────────────────────
        function render() {
            const units = GRAMMAR_DATA.units;
            const unit = units[currentUnit];
            const studyGuide = GRAMMAR_DATA.studyGuide;

            // Header
            let html = `
            <header>
              <h1>
                 <a href="/" class="flex items-center gap-2">
                       <span class="text-2xl font-bold text-indigo-600">📘</span>
                       </a>
                English <span>Grammar</span></h1>
              <div class="header-actions">
                <input type="text" id="unitSearch" placeholder="Search units..." />
                <button class="btn btn-sm btn-outline" onclick="showStudyGuide()">📖 Study Guide</button>
              </div>
            </header>
            <div class="main-grid">
              <!-- Sidebar -->
              <div class="sidebar">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                  <h3>Units</h3>
                  <span style="font-size:12px;color:#64748b;">${Object.keys(units).length} units</span>
                </div>
                <div class="progress-bar"><div class="fill" style="width:${Math.round((completedExercises.size / Object.values(units).reduce((acc,u) => acc + (u.exercises ? u.exercises.reduce((s,e) => s + e.items.length, 0) : 0), 1)) * 100)}%;"></div></div>
                <div class="unit-list" id="unitList">
                  ${Object.entries(units).map(([key, u]) => `
                    <button class="unit-item ${key === currentUnit ? 'active' : ''}" onclick="goToUnit('${key}')">
                      <span>${key}. ${u.title}</span>
                      ${completedExercises.has(key) ? '<span class="check-mark">✓</span>' : ''}
                    </button>
                  `).join('')}
                </div>
              </div>
              <!-- Content -->
              <div class="content">
                <div class="content-scroll">
                  ${unit ? `
                    <div style="display:flex;justify-content:space-between;align-items:start;flex-wrap:wrap;gap:8px;">
                      <h2>${currentUnit}. ${unit.title}</h2>
                      <span style="font-size:13px;color:#64748b;background:#f1f5f9;padding:4px 14px;border-radius:20px;">${unit.description || ''}</span>
                    </div>
                    <div class="unit-meta">
                      ${unit.exercises ? `<span>${unit.exercises.reduce((s,e) => s + e.items.length, 0)} exercises</span>` : ''}
                    </div>
                    <div class="explanation">${unit.explanation || ''}</div>
                    ${unit.exercises ? renderExercises(unit.exercises) : ''}
                  ` : `
                    <div class="empty-state">
                      <h3>Unit not found</h3>
                      <p>Please select a unit from the sidebar.</p>
                    </div>
                  `}
                </div>
              </div>
            </div>
          `;
            app.innerHTML = html;

            // Restore input values
            if (unit && unit.exercises) {
                unit.exercises.forEach((ex, ei) => {
                    ex.items.forEach((item, ii) => {
                        const key = `${currentUnit}-${ei}-${ii}`;
                        const input = document.getElementById(`input-${key}`);
                        if (input && exerciseInputs[key] !== undefined) {
                            input.value = exerciseInputs[key];
                        }
                        if (exerciseFeedback[key]) {
                            const fb = document.getElementById(`feedback-${key}`);
                            if (fb) {
                                fb.textContent = exerciseFeedback[key].msg;
                                fb.className = `feedback ${exerciseFeedback[key].correct ? 'correct' : 'incorrect'}`;
                                input.className = exerciseFeedback[key].correct ? 'correct' : 'incorrect';
                            }
                        }
                    });
                });
            }

            // Search
            const search = document.getElementById('unitSearch');
            if (search) {
                search.addEventListener('input', (e) => {
                    const q = e.target.value.toLowerCase();
                    document.querySelectorAll('.unit-item').forEach(el => {
                        const txt = el.textContent.toLowerCase();
                        el.style.display = txt.includes(q) ? 'flex' : 'none';
                    });
                });
            }

            // Re-bind exercise events
            if (unit && unit.exercises) {
                unit.exercises.forEach((ex, ei) => {
                    ex.items.forEach((item, ii) => {
                        const key = `${currentUnit}-${ei}-${ii}`;
                        const input = document.getElementById(`input-${key}`);
                        if (input) {
                            input.addEventListener('input', () => {
                                exerciseInputs[key] = input.value;
                            });
                            input.addEventListener('keydown', (e) => {
                                if (e.key === 'Enter') checkExercise(key);
                            });
                        }
                        const btn = document.getElementById(`check-${key}`);
                        if (btn) btn.onclick = () => checkExercise(key);
                    });
                    const checkAll = document.getElementById(`checkAll-${currentUnit}-${ei}`);
                    if (checkAll) checkAll.onclick = () => checkAllExercises(ei);
                    const resetAll = document.getElementById(`resetAll-${currentUnit}-${ei}`);
                    if (resetAll) resetAll.onclick = () => resetAllExercises(ei);
                });
            }
        }

        function renderExercises(exercises) {
            let html = `<div class="exercise-section">`;
            exercises.forEach((ex, ei) => {
                html += `
              <div class="exercise">
                <p>${ei+1}. ${ex.instruction}</p>
                ${ex.items.map((item, ii) => {
                  const key = `${currentUnit}-${ei}-${ii}`;
                  return `
                    <div class="question">
                      ${item.q.replace(/\_\_\_\_\_/g, '<span class="blank"></span>')}
                      <input type="text" id="input-${key}" placeholder="Type answer..." />
                      <button class="btn btn-sm btn-outline" id="check-${key}">Check</button>
                      <div id="feedback-${key}" class="feedback"></div>
                    </div>
                  `;
                }).join('')}
                <div class="exercise-actions">
                  <button class="btn btn-sm" id="checkAll-${currentUnit}-${ei}">✅ Check All</button>
                  <button class="btn btn-sm btn-outline" id="resetAll-${currentUnit}-${ei}">⟳ Reset</button>
                </div>
              </div>
            `;
            });
            html += `</div>`;
            return html;
        }

        function checkExercise(key) {
            const input = document.getElementById(`input-${key}`);
            const fb = document.getElementById(`feedback-${key}`);
            if (!input || !fb) return;
            const val = input.value.trim();
            const parts = key.split('-');
            const u = parts[0];
            const ei = parseInt(parts[1]);
            const ii = parseInt(parts[2]);
            const unit = GRAMMAR_DATA.units[u];
            if (!unit || !unit.exercises || !unit.exercises[ei]) return;
            const correct = unit.exercises[ei].items[ii].a;
            const isCorrect = val.toLowerCase() === correct.toLowerCase() ||
                val.toLowerCase().replace(/\s+/g, '') === correct.toLowerCase().replace(/\s+/g, '');
            exerciseFeedback[key] = {
                correct: isCorrect,
                msg: isCorrect ? '✓ Correct!' : `✗ Expected: "${correct}"`
            };
            fb.textContent = exerciseFeedback[key].msg;
            fb.className = `feedback ${isCorrect ? 'correct' : 'incorrect'}`;
            input.className = isCorrect ? 'correct' : 'incorrect';
            if (isCorrect) {
                completedExercises.add(u);
                // Update sidebar badge
                const badge = document.querySelector(`.unit-item[data-unit="${u}"] .check-mark`);
                // We'll re-render to update progress
                setTimeout(() => render(), 200);
            }
        }

        function checkAllExercises(ei) {
            const unit = GRAMMAR_DATA.units[currentUnit];
            if (!unit || !unit.exercises || !unit.exercises[ei]) return;
            unit.exercises[ei].items.forEach((_, ii) => {
                const key = `${currentUnit}-${ei}-${ii}`;
                checkExercise(key);
            });
        }

        function resetAllExercises(ei) {
            const unit = GRAMMAR_DATA.units[currentUnit];
            if (!unit || !unit.exercises || !unit.exercises[ei]) return;
            unit.exercises[ei].items.forEach((_, ii) => {
                const key = `${currentUnit}-${ei}-${ii}`;
                const input = document.getElementById(`input-${key}`);
                const fb = document.getElementById(`feedback-${key}`);
                if (input) { input.value = '';
                    input.className = ''; }
                if (fb) { fb.textContent = '';
                    fb.className = 'feedback'; }
                delete exerciseInputs[key];
                delete exerciseFeedback[key];
            });
            completedExercises.delete(currentUnit);
            setTimeout(() => render(), 200);
        }

        function goToUnit(key) {
            currentUnit = key;
            render();
            document.querySelector('.content-scroll')?.scrollTo(0, 0);
        }

        function showStudyGuide() {
            const sg = GRAMMAR_DATA.studyGuide;
            let html = `
            <div style="background:#fff;border-radius:16px;padding:24px;border:1px solid #e9edf4;">
              <h2 style="margin-bottom:12px;">📖 Study Guide</h2>
              <p style="color:#64748b;margin-bottom:16px;">Check your knowledge. Click a sentence to go to the unit.</p>
              <div class="study-guide-grid">
          `;
            sg.items.forEach((item, idx) => {
                const units = item.units.split(',').map(u => u.trim());
                const unitLinks = units.map(u => `<span class="sg-unit" onclick="goToUnit('${u}')">Unit ${u}</span>`).join(' ');
                html += `
              <div class="study-guide-item" onclick="goToUnit('${units[0]}')">
                <div>${item.q.replace(/\_\_\_\_\_/g, '______')}</div>
                <div style="font-size:12px;color:#64748b;margin-top:6px;">
                  Answer: <strong>${item.a}</strong> &nbsp;|&nbsp; ${unitLinks}
                </div>
              </div>
            `;
            });
            html += `</div><button class="btn" style="margin-top:16px;" onclick="render()">← Back</button></div>`;
            // Show in content area
            const content = document.querySelector('.content .content-scroll');
            if (content) content.innerHTML = html;
        }

        // ─── INIT ────────────────────────────────────────────────────────────
        render();
    </script>
    </body>
</html>
